<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Forever With You — Deelan ❤️</title>
  <meta name="description" content="A romantic poetic tribute dedicated to Deelan. Every beat of this heart belongs to you.">
  <meta name="theme-color" content="#060208">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Open Graph / WhatsApp / Facebook / Instagram -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Forever With You — Deelan ❤️">
  <meta property="og:description" content="A poetic romantic tribute dedicated to Deelan. Every beat of this heart belongs to you.">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="Forever With You — Deelan ❤️">
  <meta property="twitter:description" content="A poetic romantic tribute dedicated to Deelan. Every beat of this heart belongs to you.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Generative Canvas -->
  <div class="canvas-container">
    <canvas id="heartCanvas"></canvas>
    <div class="vignette-overlay"></div>
    <div class="ambient-glow" id="ambientGlow"></div>
  </div>

  <!-- Romantic Header Dedication -->
  <header class="romantic-header">
    <h1 class="main-title">My Heart Beats Only For You</h1>
    <p class="sub-title">
      In a universe of billions, my soul found its forever home in <span class="highlight-name">Deelan</span> <span class="heart-symbol">❤️</span>
    </p>
  </header>

  <!-- Discreet Floating Audio Toggle -->
  <div class="audio-control">
    <button class="music-btn" id="musicToggleBtn" aria-label="Toggle Romantic Music & Heartbeat">
      <span class="music-icon">🎵</span>
      <span id="musicBtnLabel">Play Romantic Music & Heartbeat</span>
      <span class="sound-wave" id="soundWave">
        <span></span><span></span><span></span><span></span>
      </span>
    </button>
  </div>

  <!-- Romantic Footer Note -->
  <footer class="romantic-footer">
    <p>Tap anywhere to send unconditional love to Deelan ✨</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
